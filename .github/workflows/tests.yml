name: Тести

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Юніт-тести
        run: python -m unittest discover -s tests -t . -v
      - name: Банк перезбирається без росконтенту
        run: |
          python tools/build_bank.py
          git diff --exit-code -- content/evergreen.json
