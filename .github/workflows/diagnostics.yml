name: Перевірка джерел

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # щопонеділка о 06:00 UTC

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Юніт-тести
        run: python -m unittest discover -s tests -t . -v
      - name: Які джерела живі
        run: python -m tools.check_sources
      - name: Чи живий бот і чи він адміністратор
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tools.check_bot
