name: Публікація в Telegram

on:
  schedule:
    # Крон GitHub — лише запасний рівень, не основний.
    #
    # Заміряно на цьому репозиторії: три розклади разом просили ~150 подій
    # на добу, а доходило 11-28. 27.08.2026 не дійшло жодної — 32 години
    # тиші й нуль постів. GitHub найагресивніше ріже саме щільні розклади,
    # тож щільність тут працювала проти нас.
    #
    # Основний запуск тепер робить зовнішній планувальник (cron-job.org),
    # який б'є по workflow_dispatch точно о 10:00, 15:00 і 20:00 за Києвом.
    # Нижче лишається економний страхувальний крон:
    #   1) кожні 20 хв у годинах UTC, коли слот може бути живим
    #      (Київ = UTC+2 узимку / UTC+3 улітку, вікно слота тягнеться
    #      до наступного, тож 07:00-20:59 UTC покриває всі три);
    #   2) щогодинний «пульс» цілодобово — підбирає прострочені слоти
    #      й тримає репозиторій активним (інакше GitHub вимикає крон
    #      після 60 днів тиші).
    - cron: "*/20 7-20 * * *"
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Запостити конкретний слот негайно (10, 15 або 20)"
        required: false
        default: ""
      dry_run:
        description: "Тільки показати пост, не надсилати"
        type: boolean
        default: false

# Два запуски не мають постити одночасно.
concurrency:
  group: telegram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Залежності
        run: pip install -r requirements.txt

      - name: Тести (фільтр, слоти, банк)
        run: python -m unittest discover -s tests -t . -q

      - name: Опублікувати
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          SLOT: ${{ inputs.slot }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          ARGS=""
          if [ -n "$SLOT" ]; then ARGS="$ARGS --force-slot $SLOT"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m bot.main $ARGS

      - name: Зберегти стан
        if: always()
        run: |
          git config user.name "art-bot"
          git config user.email "art-bot@users.noreply.github.com"
          if git diff --quiet -- state/state.json; then
            echo "стан не змінився"
            exit 0
          fi
          git add state/state.json
          git commit -m "state: $(date -u '+%F %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "не вдалося запушити стан — не критично"
