name: Публікація в Telegram

on:
  schedule:
    # GitHub виконує крон «за можливості»: у години пік події просто
    # губляться. Заміряно на цьому репозиторії — між запусками "*/15"
    # реально було від 20 до 214 хвилин, тобто один розрив перекрив усе
    # вікно слота. Тому крон тепер трирівневий:
    #
    #   1) щільна серія лише в тих годинах UTC, коли слот може бути живим.
    #      Київ = UTC+2 узимку і UTC+3 улітку, вікно слота — 150 хв, отже
    #      10:00 Київ -> 07:00-10:30 UTC, 15:00 -> 12:00-15:30, 20:00 -> 17:00-20:30;
    #   2) друга серія зі зсувом: це окрема подія в планувальнику GitHub,
    #      і вона може дійти навіть тоді, коли першу загубили;
    #   3) щогодинний «пульс» цілодобово — закриває прострочені слоти
    #      й тримає репозиторій активним (інакше GitHub вимкне крон
    #      після 60 днів тиші).
    - cron: "*/10 7-20 * * *"
    - cron: "7,27,47 7-20 * * *"
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Запостити конкретний слот негайно (10, 15 або 20)"
        required: false
        default: ""
      dry_run:
        description: "Тільки показати пост, не надсилати"
        type: boolean
        default: false

# Два запуски не мають постити одночасно.
concurrency:
  group: telegram-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Залежності
        run: pip install -r requirements.txt

      - name: Тести (фільтр, слоти, банк)
        run: python -m unittest discover -s tests -t . -q

      - name: Опублікувати
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          SLOT: ${{ inputs.slot }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          ARGS=""
          if [ -n "$SLOT" ]; then ARGS="$ARGS --force-slot $SLOT"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m bot.main $ARGS

      - name: Зберегти стан
        if: always()
        run: |
          git config user.name "art-bot"
          git config user.email "art-bot@users.noreply.github.com"
          if git diff --quiet -- state/state.json; then
            echo "стан не змінився"
            exit 0
          fi
          git add state/state.json
          git commit -m "state: $(date -u '+%F %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          echo "не вдалося запушити стан — не критично"
